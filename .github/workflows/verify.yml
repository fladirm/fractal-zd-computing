name: Algebraic validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  python-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 src/python/verify.py
  rust-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path src/rust/Cargo.toml
